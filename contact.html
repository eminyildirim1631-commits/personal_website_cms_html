<!DOCTYPE html><html lang="tr" class="ld"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title data-en="Contact | Emin Yıldırım">İletişim | Emin Yıldırım</title><meta name="theme-color" content="#0b0c0f"><meta name="description" content="İletişim bilgileri, iletişim formu ve harita."><link rel="stylesheet" href="style.css"><style>.ld main{opacity:0}main{transition:opacity .25s}</style><script src="config.js" defer></script><script src="cms.js" defer></script><script src="render.js" defer></script></head><body>
<main><div class="wrap"><h1 class="pt" data-en="Contact">İletişim</h1><p class="lead" data-en="For project collaborations, questions or feedback, fill out the form below or reach out to me directly through my contact details.">Proje iş birlikleri, sorularınız veya geri bildirimleriniz için aşağıdaki formu doldurabilir ya da iletişim kanallarımdan bana doğrudan ulaşabilirsiniz.</p>
<div class="contact"><dl><dt data-en="Address">Adres</dt><dd data-en="{{addr_en}}">{{addr_tr}}</dd>
<dt data-en="Phone">Telefon</dt><dd>{{phone_tr}}</dd>
<dt data-en="Email">E-posta</dt><dd><a href="mailto:{{email_tr}}">{{email_tr}}</a></dd></dl>
<form id="cf"><label><span data-en="Full name">Adınız Soyadınız</span><input name="n" required autocomplete="name"></label>
<label><span data-en="Email address">E-posta adresiniz</span><input name="e" type="email" required autocomplete="email"></label>
<label><span data-en="Subject">Konu</span><input name="s" required></label>
<label><span data-en="Your message">Mesajınız</span><textarea name="m" required></textarea></label>
<button class="btn fill" type="submit" data-en="Send message">Mesajı gönder</button><p class="mu" id="st" role="status"></p></form></div>
<iframe title="Google Maps" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=Hasank%C3%B6y%2C%20G%C3%BCrsu%2C%20Bursa&output=embed"></iframe></div></main></body></html>
